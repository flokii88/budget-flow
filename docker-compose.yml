services:
  budget-flow:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # URL de l'instance PocketBase
        - VITE_POCKETBASE_URL=${VITE_POCKETBASE_URL:-http://127.0.0.1:8090}
    container_name: budget-flow
    restart: unless-stopped
    ports:
      - "3000:80"

  # Optionnel : décommentez si vous souhaitez héberger PocketBase dans le même conteneur LXC
  # pocketbase:
